<style>

.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}

.seg button + button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"].l1{background:var(--lv1-bg);color:var(--lv1);font-weight:700}
.seg button[aria-pressed="true"].l2{background:var(--lv2-bg);color:var(--lv2);font-weight:700}
.seg button[aria-pressed="true"].l3{background:var(--lv3-bg);color:var(--lv3);font-weight:700}
.seg button[aria-pressed="true"].l4{background:var(--lv4-bg);color:var(--lv4);font-weight:700}
td.op textarea{min-height:96px;font-size:14px;border-color:transparent;background:var(--sunk)}

.cnt{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:11px;color:var(--muted);margin-top:4px;display:flex;gap:10px}

}

<div class="wrap">
  <header>
    <h1>평가 입력기</h1>
    <p>평가 영역별 기준을 넣으면 최상·상·중·하 의견을 8개씩 만듭니다. 학생마다 척도를 고르면 영역별 문장을 조합해 바로 복사할 수 있어요. 과목을 바꾸면 과목별로 따로 저장됩니다.</p>
    <div class="meta">
      <label for="subject">과목 <select id="subject"></select></label>
      <label for="grade">학년 <select id="grade"><option value="">선택</option><option>1학년</option><option>2학년</option><option>3학년</option><option>4학년</option><option>5학년</option><option>6학년</option></select></label>
    </div>
  </header>

  <section class="panel" aria-labelledby="h1">
    <div class="panel-head">
      <h2 id="h1"><span class="step">1</span>평가 영역과 의견</h2>
      <button id="addArea">+ 영역 추가</button>
    </div>
    <div class="panel-body" id="areas"></div>
  </section>

  <section class="panel" aria-labelledby="h2">
    <div class="panel-head">
      <h2 id="h2"><span class="step">2</span>학생별 평가 입력</h2>
      <div class="toolbar">
        <label for="count" style="font-size:13px;color:var(--muted)">학생 수</label>
        <input type="number" id="count" min="1" max="60" style="width:76px">
        <button class="primary" id="makeTbl">표 만들기</button>
      </div>
    </div>
    <div class="panel-body">
      <div class="toolbar">
        <p class="hint">같은 척도를 고른 학생끼리는 가능한 한 서로 다른 문장이 배정됩니다. 의견 칸은 직접 고칠 수도 있어요.</p>
        <span class="sp"></span>
        <button id="reshuffle">전체 다시 조합</button>
        <button id="copyAll">전체 복사</button>
      </div>
      <div class="tbl-wrap"><table>
        <thead><tr id="thead"></tr></thead>
        <tbody id="tbody"></tbody>
      </table></div>
    </div>
  </section>
</div>

<script>
const LV = ["최상","상","중","하"];
const KEY = "pe-eval-input-v1";
const uid = () => Math.random().toString(36).slice(2,9);

const EXAMPLE_OPS = {

"왕복오래달리기, 윗몸말아올리기 등 측정 종목의 바른 자세를 정확히 익혀 수행함. 측정 결과를 그래프로 정리하고 목표를 세워 꾸준히 노력하는 자세가 매우 훌륭함.",
"건강 체력 요소와 이를 기르는 운동을 연결하여 설명하는 능력이 뛰어남. 주간 운동 계획표를 성실히 작성하고 실천 결과를 스스로 평가하며 꾸준히 성장함.",
"자신의 체력 수준을 객관적으로 파악하고 실천 가능한 목표를 세움. 수업 시간 외에도 줄넘기와 달리기를 꾸준히 실천하여 체력이 크게 향상됨.",

/* ---------- 의견 생성 (Claude) ---------- */
function setStatus(id, msg, err){ const s=$("#st-"+id); if(!s) return; s.hidden=!msg; s.textContent=msg||""; s.classList.toggle("err",!!err); }
const ERR = {
  not_granted:"Claude 사용 허용이 필요합니다. 허용하지 않으면 의견을 직접 입력해 주세요.",
  sampling_disabled:"이 계정에서는 자동 생성을 쓸 수 없습니다. 의견을 직접 입력해 주세요.",
  rate_limited:"요청이 많습니다. 잠시 후 다시 눌러 주세요.",
  invalid_json:"결과 형식이 맞지 않았습니다. 다시 생성해 주세요.",
  session_expired:"로그인이 만료되었습니다. 다시 로그인해 주세요.",
};
function buildPrompt(a){
  return `당신은 초등학교 ${G.grade||""} ${G.subject} 교과를 가르치는 교사입니다. 학교생활기록부 '교과학습발달상황(세부능력 및 특기사항)'에 쓸 평가 의견을 만듭니다.

과목: ${G.subject}
평가 영역: ${a.name||"(이름 없음)"}
주요 활동: ${(a.activity||"").trim()||"(없음)"}
평가 기준: ${a.criteria}

규칙:
- 주요 활동이 있으면 의견에 그 활동 이름이나 장면을 자연스럽게 녹여 구체적으로 씁니다.
- 성취 수준 "최상", "상", "중", "하" 각각 서로 다른 의견을 정확히 8개씩 씁니다.
- 의견 하나는 반드시 정확히 두 문장입니다. 각 문장은 마침표로 끝납니다.
- 생활기록부 문체: 명사형 종결("~함.", "~임.", "~보임.", "~필요함." 등). 학생 이름이나 "학생은", "이 학생은" 같은 주어는 쓰지 않습니다.
- 평가 기준의 구체적인 지식·기능·태도 요소를 근거로 관찰 가능한 행동을 서술합니다.
- 최상·상은 강점 중심, 중은 성취와 보완점, 하는 노력과 성장 가능성을 긍정적으로 서술하되 부정적·비하 표현은 쓰지 않습니다.
- 같은 수준 안에서 첫 어절과 표현이 겹치지 않게 다양하게 씁니다. 의견 하나는 60~110자 정도.

다음 JSON 객체 하나만 답하세요(다른 텍스트 없이):
{"최상":["...",...8개],"상":[...8개],"중":[...8개],"하":[...8개]}`;
}
function parseOps(r){
  if (typeof r==="string"){
    const m = r.match(/\{[\s\S]*\}/); if(!m) throw {code:"invalid_json"};
    try{ r = JSON.parse(m[0]); }catch(e){ throw {code:"invalid_json"}; }
  }
  const ops = {};
  for (const lv of LV){
    const arr = Array.isArray(r?.[lv]) ? r[lv].map(s=>String(s).replace(/\s+/g," ").trim()).filter(Boolean) : [];
    ops[lv] = arr.slice(0,8);
  }
  if (!LV.some(l=>ops[l].length)) throw {code:"invalid_json"};
  return ops;
}
function applyOps(a, ops){
  a.ops = ops; a.example = false;
  renderAll(); save();
  const short = LV.filter(l=>ops[l].length<8);
  setStatus(a.id, short.length ? `${short.join(", ")} 의견이 8개보다 적습니다. 직접 보충하거나 다시 생성해 주세요.` : "의견 32개를 넣었습니다. 필요하면 직접 다듬어 주세요.", !!short.length);
}

async function generate(id, btn){
  const a = S.areas.find(x=>x.id===id);
  if (!a.criteria.trim()){ setStatus(id,"평가 기준을 먼저 입력해 주세요.",true); $("#ac-"+id).focus(); return; }
  if (!sample){ setStatus(id,"이 화면에서는 자동 생성이 연결되어 있지 않아요. 아래 방법으로 Claude에게 받아 넣거나 의견을 직접 입력해 주세요."); showManual(a); return; }
  btn.disabled = true; const old = btn.textContent; btn.textContent = "생성 중…";
  setStatus(id,"Claude가 의견 32개를 쓰고 있어요. 30초~1분 정도 걸립니다.");
  const prompt = buildPrompt(a);
  try{
    const r = await sample.json(prompt, {cache:false});
    applyOps(a, parseOps(r));
  }catch(e){
    setStatus(id, ERR[e?.code] || "생성하지 못했습니다. 잠시 후 다시 시도해 주세요.", true);
    btn.disabled = false; btn.textContent = old;
  }
}

/* ---------- 학생 표 ---------- */
function opText(a, lv, idx){ const L=(a.ops[lv]||[]); return L.length ? L[((idx||0)%L.length+L.length)%L.length] : ""; }
function compose(r){ return S.areas.map(a=> r.sel[a.id] ? opText(a, r.sel[a.id], r.pick[a.id]) : "").filter(Boolean).join(" "); }
function rowText(r){ return r.custom ?? compose(r); }
function pickFor(areaId, lv, rowIdx, avoid){
  const a = S.areas.find(x=>x.id===areaId); const n = Math.max((a.ops[lv]||[]).length,1);
  const used = new Array(n).fill(0);
  S.rows.forEach((r,i)=>{ if(i!==rowIdx && r.sel[areaId]===lv && r.pick[areaId]!=null) used[r.pick[areaId]%n]++; });
  let cand = [...Array(n).keys()].filter(k=>k!==avoid); if(!cand.length) cand=[0];
  const min = Math.min(...cand.map(k=>used[k]));
  cand = cand.filter(k=>used[k]===min);
  return cand[Math.floor(Math.random()*cand.length)];
}
const bytes = s => { let b=0; for(const ch of s){ b += ch==="\n"?2:(new TextEncoder().encode(ch).length); } return b; };
function cntHTML(r){ const t=rowText(r); return `<span>${t.length}자</span><span>${bytes(t)}바이트</span>${r.custom!=null?'<span class="edited">직접 수정됨</span>':''}`; }

    </th><th>의견</th><th>복사</th>`;
  if (!S.rows.length){ $("#tbody").innerHTML = `<tr><td colspan="4" class="empty">학생 수를 입력하고 “표 만들기”를 누르세요.</td></tr>`; return; }
  $("#tbody").innerHTML = S.rows.map((r,i)=>`

          <div class="seg" role="group" aria-label="${esc(a.name)}">${LV.map((l,j)=>`<button class="l${j+1}" data-a="${a.id}" data-lv="${l}" aria-pressed="${r.sel[a.id]===l}">${l}</button>`).join("")}</div>
        </div>`).join("") : '<span class="hint">먼저 평가 영역을 추가하세요.</span>'}</td>
      <td class="op"><textarea id="ot-${i}" aria-label="${i+1}번 의견" placeholder="척도를 선택하면 의견이 조합됩니다.">${esc(rowText(r))}</textarea><div class="cnt" id="oc-${i}">${cntHTML(r)}</div></td>
      <td class="cp"><div class="cp-col"><button class="primary" data-copy="${i}">복사</button><button data-re="${i}" title="같은 척도의 다른 문장으로 바꿉니다">다른 문장</button></div></td>
    </tr>`).join("");

const short = s => (s||"영역").split(/[–-]/).pop().trim().slice(0,8);
function refreshRow(i){ const r=S.rows[i]; const t=$("#ot-"+i); if(t && document.activeElement!==t) t.value=rowText(r); const c=$("#oc-"+i); if(c) c.innerHTML=cntHTML(r); }
function refreshTexts(){ S.rows.forEach((_,i)=>refreshRow(i)); }

$("#tbody").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  const tr = b.closest("tr"); const i = +tr.dataset.i; const r = S.rows[i];
  if (b.dataset.lv){
    const id=b.dataset.a, lv=b.dataset.lv;
    if (r.sel[id]===lv){ delete r.sel[id]; delete r.pick[id]; }
    else { r.sel[id]=lv; r.pick[id]=pickFor(id,lv,i); }
    r.custom=null;
    tr.querySelectorAll(`.seg button[data-a="${id}"]`).forEach(x=>x.setAttribute("aria-pressed", r.sel[id]===x.dataset.lv));
    refreshRow(i); save();
  } else if (b.dataset.re!=null){
    S.areas.forEach(a=>{ if(r.sel[a.id]) r.pick[a.id]=pickFor(a.id,r.sel[a.id],i,r.pick[a.id]); });
    r.custom=null; refreshRow(i); save();
  } else if (b.dataset.copy!=null){
    copy(rowText(r), b, $("#ot-"+i));
  }
});
$("#tbody").addEventListener("input", e=>{
  const t=e.target; if(!t.id.startsWith("ot-")) return;
  const i=+t.id.slice(3); const r=S.rows[i];
  r.custom = t.value===compose(r) ? null : t.value;
  $("#oc-"+i).innerHTML=cntHTML(r); save();
});
$("#thead").addEventListener("change", e=>{
  const s=e.target; if(!s.dataset.bulk) return;
  const id=s.dataset.bulk, v=s.value; if(!v) return;
  S.rows.forEach((r,i)=>{ if(v==="-"){ delete r.sel[id]; delete r.pick[id]; } else { r.sel[id]=v; r.pick[id]=undefined; } r.custom=null; });
  if (v!=="-") S.rows.forEach((r,i)=>{ r.pick[id]=pickFor(id,v,i); });
  s.value=""; renderTable(); save();
});
$("#makeTbl").onclick = ()=>{
  const n = Math.max(1, Math.min(60, parseInt($("#count").value)||0));
  while (S.rows.length<n) S.rows.push({sel:{},pick:{},custom:null});
  S.rows.length = n; renderTable(); save();
};
$("#count").addEventListener("keydown", e=>{ if(e.key==="Enter") $("#makeTbl").click(); });
$("#reshuffle").onclick = ()=>{
  S.rows.forEach(r=>{ r.pick={}; r.custom=null; });
  S.rows.forEach((r,i)=>S.areas.forEach(a=>{ if(r.sel[a.id]) r.pick[a.id]=pickFor(a.id,r.sel[a.id],i); }));
  refreshTexts(); save();
};
$("#copyAll").onclick = e=>{
  const txt = S.rows.map((r,i)=>`${i+1}\t${rowText(r).replace(/\s*\n\s*/g," ")}`).join("\n");
  copy(txt, e.currentTarget, null);
};
async function copy(text, btn, field){
  const old = btn.textContent;
  try{ await navigator.clipboard.writeText(text); btn.textContent="복사됨"; btn.classList.add("done"); }
  catch(err){
    if (field){ field.focus(); field.select(); btn.textContent="선택됨 · Ctrl+C"; }
    else { btn.textContent="복사 실패"; }
  }
  setTimeout(()=>{ btn.textContent=old; btn.classList.remove("done"); }, 1400);
}

  renderAll(); saveNow();
};
$("#grade").onchange = e=>{ G.grade=e.target.value; save(); };
function renderAll(){ renderAreas(); renderTable(); fitAll(document); }
window.addEventListener("pagehide", saveNow);
renderAll();
